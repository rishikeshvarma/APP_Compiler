name: evals
on: [push, pull_request]
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit + regression tests (no API key needed)
        run: python -m pytest -q
      - name: Replay recorded outputs and gate on regressions
        run: python -m evals.runner --replay evals/recorded --no-judge --baseline evals/baseline.json
